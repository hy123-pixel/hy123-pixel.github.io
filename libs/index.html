  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  function iconHtml(s, cls = "software-icon") {
    if (!s.icon) return '<span class="' + cls + '" style="background:' + (s.color || "#f0efff") + ';color:' + (s.text || "#f57c00") + '">' + esc((s.name || "?").charAt(0)) + '</span>';
    if (/^(https?:|\/)/.test(s.icon)) {
      return '<span class="' + cls + '" style="background:' + (s.color || "#f0efff") + '"><img src="' + esc(s.icon) + '" alt="' + esc(s.name) + ' 图标" data-fb="' + esc((s.name || "?").charAt(0)) + '" data-fbcolor="' + esc(s.text || "#f57c00") + '"></span>';
    }
    return '<span class="' + cls + '" style="background:' + (s.color || "#f0efff") + ';color:' + (s.text || "#f57c00") + '">' + esc(s.icon) + '</span>';
  }

  function stackChips(stack) {
    return String(stack || "").split("·").map(x => x.trim()).filter(Boolean)
      .map(x => '<span>' + esc(x) + '</span>').join("");
  }

  function cardHtml(s, idx) {
    const search = [s.name, s.tag, s.desc, s.function, s.stack, s.language, s.platform].join(" ");
    return '<article class="el-card software-card" data-index="' + idx + '" data-search="' + esc(search) + '" tabindex="0" role="button" aria-haspopup="dialog">'
      + '<div class="software-card-top">'
      + iconHtml(s, "software-card-icon")
      + '<div class="software-card-head"><h3>' + esc(s.name) + '</h3>' + (s.tag ? '<span class="el-tag el-tag--primary">' + esc(s.tag) + '</span>' : '') + '</div>'
      + '</div>'
      + '<p class="software-card-desc">' + esc(s.desc) + '</p>'
      + '<div class="lib-card-stack">' + stackChips(s.stack) + '</div>'
      + '</article>';
  }

  const listEl = document.getElementById("libList");
  listEl.innerHTML = LIBS.map(cardHtml).join("");

  listEl.querySelectorAll(".software-card-icon img").forEach(function (img) {
    img.addEventListener("error", function () {
      var fb = document.createElement("span");
      fb.textContent = img.dataset.fb || "?";
      fb.style.cssText = "font-size:22px;font-weight:700;color:" + (img.dataset.fbcolor || "#f57c00");
      img.replaceWith(fb);
    });
  });

  const searchEl = document.getElementById("libSearch");
  const countEl = document.getElementById("libCount");
  const cards = Array.prototype.slice.call(listEl.querySelectorAll(".software-card"));
  function applyFilter(q) {
    q = q.trim().toLowerCase();
    let shown = 0;
    cards.forEach(function (c) {
      const ok = !q || (c.dataset.search || "").toLowerCase().indexOf(q) !== -1;
      c.style.display = ok ? "" : "none";
      if (ok) shown++;
    });
    countEl.textContent = "共 " + cards.length + " 个库，当前显示 " + shown + " 个";
  }
  searchEl.addEventListener("input", function (e) { applyFilter(e.target.value); });
  applyFilter("");

    document.getElementById("libModalStack").innerHTML = stackChips(s.stack) || '<span>—</span>';

    const codeWrap = document.getElementById("libModalCodeWrap");
    if (s.code) { codeWrap.style.display = ""; document.getElementById("libModalCode").textContent = s.code; }
    else { codeWrap.style.display = "none"; }

    const stats = [];
    if (s.language) stats.push(['语言', s.language]);
    if (s.platform) stats.push(['平台', s.platform]);
    if (s.license) stats.push(['协议', s.license]);
    if (s.install) stats.push(['安装', s.install]);
    if (s.stars) stats.push(['星标', s.stars]);
    document.getElementById("libModalStats").innerHTML = stats.map(function (p) {
      return '<div><span>' + esc(p[0]) + '</span><strong>' + esc(p[1]) + '</strong></div>';
    }).join("");

    const acts = [];
    if (s.repo) acts.push('<a class="el-button el-button--primary" href="' + esc(s.repo) + '" target="_blank" rel="noopener">查看仓库</a>');
    if (s.docs) acts.push('<a class="el-button" href="' + esc(s.docs) + '" target="_blank" rel="noopener">官方文档</a>');
    document.getElementById("libModalActions").innerHTML = acts.join("");

    modal.hidden = false;
    body.classList.add("software-modal-open");
    setTimeout(() => modal.classList.add("is-visible"), 10);
    modal.querySelector(".software-modal-close").focus();
  }

  function closeModal() {
    modal.classList.remove("is-visible");
    setTimeout(() => { modal.hidden = true; body.classList.remove("software-modal-open"); }, 250);
  }

  listEl.addEventListener("click", function (e) {
    const item = e.target.closest(".software-card");
    if (item) openModal(item.dataset.index);
  });
  listEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      const item = e.target.closest(".software-card");
      if (item) { e.preventDefault(); openModal(item.dataset.index); }
    }
  });
  modal.addEventListener("click", function (e) { if (e.target.hasAttribute("data-close")) closeModal(); });
  modal.querySelector(".software-modal-close").addEventListener("click", closeModal);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeModal(); });
</script>
<script src="/scripts/metrics.js"></script></body></html>
