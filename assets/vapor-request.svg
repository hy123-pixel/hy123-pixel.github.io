<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="380" height="280" fill="#fcfcfe"/>
  <text x="190" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3a4c">一次请求的生命周期</text>
  <rect x="24" y="56" width="120" height="40" rx="8" fill="#0ea5e9"/>
  <text x="84" y="81" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">HTTP 请求</text>
  <path d="M148 76 H172" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
  <rect x="180" y="56" width="120" height="40" rx="8" fill="#6366f1"/>
  <text x="240" y="81" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">匹配路由</text>
  <path d="M300 76 H172" stroke="#94a3b8" stroke-width="0"/>
  <!-- vertical chain -->
  <path d="M240 96 V118" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
  <rect x="180" y="118" width="120" height="40" rx="8" fill="#818cf8"/>
  <text x="240" y="143" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">调用 Handler</text>
  <path d="M240 158 V180" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
  <rect x="180" y="180" width="120" height="40" rx="8" fill="#22c55e"/>
  <text x="240" y="205" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Fluent 读写数据</text>
  <path d="M240 220 V242" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
  <rect x="180" y="242" width="120" height="32" rx="8" fill="#14b8a6"/>
  <text x="240" y="263" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">返回响应</text>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
